# Nginx: sirve el frontend y reenvía la API (ADR-012, research §7).
# HTTP solo en el entorno local (desviación temporal DT-02 de la constitución, prorrogada en
# v1.3.0 después de 002); HTTPS se configura junto con el despliegue, dentro del Sprint 2.

server {
    listen 80;
    server_name _;

    # DNS interno de Docker: "api" se resuelve en cada petición (caché de 10 s) en lugar
    # de fijarse al arrancar, así un contenedor api recreado (IP nueva) no provoca 502.
    # proxy_pass con variable fuerza esa resolución dinámica; al no llevar URI, se
    # reenvía la URI original completa (/api/..., /docs, /openapi.json, /health).
    resolver 127.0.0.11 valid=10s ipv6=off;
    resolver_timeout 5s;
    set $api_sga http://api:8000;

    root /usr/share/nginx/html;
    index index.html;

    # API, documentación OpenAPI y verificación de estado.
    location /api/ {
        # Los PDF a verificar pesan hasta 5 MB (FR-016); se deja un margen.
        client_max_body_size 6m;
        proxy_pass $api_sga;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass $api_sga;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass $api_sga;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass $api_sga;
        proxy_set_header Host $host;
    }

    # Archivos con huella en el nombre (Vite): se cachean un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
