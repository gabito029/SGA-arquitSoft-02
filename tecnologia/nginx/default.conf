# Nginx: sirve el frontend y reenvía la API (ADR-012, research §7).
# HTTP solo en el entorno local del incremento 001 (desviación temporal DT-02 de la
# constitución v1.2.0); HTTPS se configura en el incremento 002 junto con el despliegue.

upstream api_sga {
    server api:8000;
}

server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # API, documentación OpenAPI y verificación de estado.
    location /api/ {
        proxy_pass http://api_sga;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    location = /docs {
        proxy_pass http://api_sga;
        proxy_set_header Host $host;
    }

    location = /openapi.json {
        proxy_pass http://api_sga;
        proxy_set_header Host $host;
    }

    location = /health {
        proxy_pass http://api_sga;
        proxy_set_header Host $host;
    }

    # Archivos con huella en el nombre (Vite): se cachean un año.
    location /assets/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
        try_files $uri =404;
    }

    # SPA: cualquier otra ruta la resuelve React Router.
    location / {
        add_header Cache-Control "no-cache";
        try_files $uri $uri/ /index.html;
    }
}
