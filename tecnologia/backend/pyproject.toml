[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sga-backend"
version = "0.1.0"
description = "SGA - Sistema de Gestión de Almacén con Firma Digital (API del incremento 001)"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.115,<1.0",
    "uvicorn[standard]>=0.32",
    "pydantic>=2.9,<3",
    "pydantic-settings>=2.6",
    "sqlalchemy>=2.0.36,<2.1",
    "alembic>=1.14",
    "psycopg[binary]>=3.2,<4",
    "cryptography>=43",
    "pyjwt>=2.10",
    "bcrypt>=4.2",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3",
    "httpx>=0.28",
    "pytest-cov>=6.0",
    "ruff>=0.8",
]

[tool.setuptools.packages.find]
include = ["app*", "seeds*"]

# --- Ruff: lint y formato (EQ-07) ---
[tool.ruff]
line-length = 100
target-version = "py312"
extend-exclude = ["migrations/versions/__pycache__"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "SIM", "N"]
ignore = [
    "B008", # Depends(...) en los argumentos por defecto es el patrón de FastAPI
]

[tool.ruff.lint.isort]
known-first-party = ["app", "seeds", "tests"]

# --- pytest ---
[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"
markers = [
    "integracion: requiere PostgreSQL (DATABASE_URL_TEST)",
]

# --- Cobertura de los módulos críticos (constitución, principio VI) ---
[tool.coverage.run]
source = [
    "app/modules/requests",
    "app/modules/rules",
    "app/modules/signing",
    "app/modules/inventory",
]
branch = true

[tool.coverage.report]
fail_under = 60
show_missing = true
skip_empty = true
