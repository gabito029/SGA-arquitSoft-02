size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">Inspectoría General y</text><text x="1590.0" y="231" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">Dirección de Telemática</text><rect x="560" y="560" width="700" height="160" rx="6" fill="#2f5fae" stroke="#2a3f66" stroke-width="1.5"/><text x="910.0" y="588" font-size="24" font-weight="bold" text-anchor="middle" fill="#fff">SGA</text><text x="910.0" y="608" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#d8e4f8">[Sistema de software]</text><text x="910.0" y="630" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">Gestión digital de requerimientos de almacén</text><text x="910.0" y="649" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">con firma digital por conducto regular,</text><text x="910.0" y="668" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">inventario, alertas y auditoría</text><path d="M230 256 V390 H700 V556" fill="none" stroke="#666" stroke-width="2" marker-end="url(#gray)"/><path d="M570 256 V345 H800 V556" fill="none" stroke="#666" stroke-width="2" marker-end="url(#gray)"/><path d="M910 256 V556" fill="none" stroke="#666" stroke-width="2" marker-end="url(#gray)"/><path d="M1250 256 V345 H1020 V556" fill="none" stroke="#666" stroke-width="2" marker-end="url(#gray)"/><path d="M1590 256 V390 H1120 V556" fill="none" stroke="#666" stroke-width="2" marker-end="url(#gray)"/><rect x="-2.700000000000017" y="287" width="465.40000000000003" height="18" fill="#fff"/><text x="230" y="300" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Registra requerimientos, da el visto bueno y firma el acta [HTTPS]</text><rect x="478.75" y="311" width="182.5" height="18" fill="#fff"/><text x="570" y="324" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Da su conformidad [HTTPS]</text><rect x="732.5" y="287" width="355.0" height="18" fill="#fff"/><text x="910" y="300" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Autoriza material de guerra o montos altos [HTTPS]</text><rect x="1155.3" y="311" width="189.4" height="18" fill="#fff"/><text x="1250" y="324" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Aprueba y despacha [HTTPS]</text><rect x="1440.1" y="287" width="299.8" height="18" fill="#fff"/><text x="1590" y="300" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Verifica la auditoría y administra [HTTPS]</text><rect x="1500" y="590" width="420" height="110" rx="6" fill="#9a9a9a" stroke="#777" stroke-width="1.5" stroke-dasharray="7 4"/><text x="1710.0" y="618" font-size="17" font-weight="bold" text-anchor="middle" fill="#fff">SIGA MEF</text><text x="1710.0" y="638" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#eee">[Sistema externo]</text><text x="1710.0" y="660" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">Gestión de bienes del Estado (MEF)</text><text x="1710.0" y="679" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#fff">No integrado en el prototipo</text><path d="M1262 640 H1498" fill="none" stroke="#888" stroke-width="2" stroke-dasharray="7 4" marker-end="url(#gray)"/><rect x="1312.9" y="617" width="134.2" height="18" fill="#fff"/><text x="1380" y="630" font-size="12.5" font-weight="normal" text-anchor="middle" fill="#1a1a1a">Integración futura</text><rect x="560" y="780" width="700" height="70" rx="6" fill="#f6f6f6" stroke="#999" stroke-width="1.2" stroke-dasharray="5 4"/><text x="910" y="808" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#555">Fuera del alcance: compras, pagos a proveedores y</text><text x="910" y="830" font-size="13.5" font-weight="normal" text-anchor="middle" fill="#555">certificados digitales acreditados (IOFE).</text><rect x="28" y="940" width="880" height="150" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="48" y="970" font-size="16" font-weight="bold" text-anchor="start" fill="#1a1a1a">Leyenda</text><rect x="48" y="990" width="260" height="36" rx="3" fill="#1f3a68" stroke="#555" stroke-width="1.2"/><text x="178" y="1014" font-size="14" font-weight="normal" text-anchor="middle" fill="#fff">Persona</text><rect x="333" y="990" width="260" height="36" rx="3" fill="#2f5fae" stroke="#555" stroke-width="1.2"/><text x="463" y="1014" font-size="14" font-weight="normal" text-anchor="middle" fill="#fff">Sistema / contenedor</text><rect x="618" y="990" width="260" height="36" rx="3" fill="#9a9a9a" stroke="#555" stroke-width="1.2" stroke-dasharray="7 4"/><text x="748" y="1014" font-size="14" font-weight="normal" text-anchor="middle" fill="#fff">Sistema externo</text><text x="48" y="1065" font-size="13" font-weight="normal" text-anchor="start" fill="#333">Flecha: relación con verbo y [protocolo] · Línea discontinua: límite o relación futura</text><rect x="930" y="940" width="1050" height="150" rx="4" fill="#fff" stroke="#888" stroke-width="1.5"/><text x="950" y="970" font-size="16" font-weight="bold" text-anchor="start" fill="#1a1a1a">Notas</text><text x="950" y="1002" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">• El SGA es una sola caja: este nivel no muestra tecnologías ni módulos.</text><text x="950" y="1030" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">• Los usuarios son roles de personas de distintos órganos del Ejército.</text><text x="950" y="1058" font-size="13.5" font-weight="normal" text-anchor="start" fill="#1a1a1a">• El SIGA MEF es el sistema oficial del Estado; su integración queda a futuro.</text></svg>